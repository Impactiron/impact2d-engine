name: Deploy !mpact2d Engine to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: wenn du z. B. eine README oder Version erzeugen willst,
      # kann hier ein Build-Schritt hinzugefügt werden.

      - name: Upload build artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # 🔹 Alle relevanten Engine-Dateien & Maps mitnehmen
          path: |
            index.html
            engine/
            maps/
            assets/
            favicon.ico
            CHANGELOG.md
            VERSIONS.md
            ROADMAP.md

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
