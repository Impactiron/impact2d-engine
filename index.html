<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Impact2D Engine — Pure ESM 2D Game Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Impact2D - A complete 2D game engine running in the browser with no external servers"
    />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="loading">Loading…</div>
    <div id="hud"></div>
    <div id="debug"></div>

    <div class="examples-link">
      <a href="examples/index.html">→ Examples</a>
    </div>

    <script type="module" src="./engine/main.js"></script>

    <!-- Debug toggle (F1) -->
    <script type="module">
      window.addEventListener('DOMContentLoaded', () => {
        window.addEventListener('keydown', e => {
          if (e.key === 'F1') {
            e.preventDefault();
            const debug = document.getElementById('debug');
            debug.classList.toggle('active');
          }
        });
      });
    </script>
  </body>
</html>
